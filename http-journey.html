<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一次請求的旅程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Patrick+Hand&display=swap">
<style>
/* Hand-drawn look matching the HTTP deck (Excalidraw palette). Deliberately single light theme: these pages sit on white slides. */
:root{
  --paper:#ffffff; --ink:#1e1e1e; --muted:#6c757d; --line:#ced4da; --soft:#f8f9fa;
  --blue:#1971c2; --blue-bg:#e7f5ff; --blue-hatch:rgba(25,113,194,.32);
  --yellow:#e67700; --yellow-bg:#fff9db; --yellow-hatch:rgba(240,140,0,.38);
  --orange:#e8590c; --orange-bg:#fff4e6;
  --green:#2f9e44; --green-bg:#ebfbee;
  --red:#e03131; --red-bg:#fff5f5;
  --pink:#c2255c; --pink-bg:#fff0f6;
  --violet:#6741d9; --violet-bg:#f3f0ff;
  --hand:"Patrick Hand","LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai","KaiTi",cursive;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;box-sizing:border-box;background:var(--paper);color:var(--ink);font-family:var(--hand);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
*,*::before,*::after{box-sizing:border-box}
.viewport{position:relative;width:100%;height:100%;overflow:hidden}
.stage{position:absolute;left:50%;top:0;width:1280px;height:720px;transform:translateX(-50%) scale(var(--s,1));transform-origin:top center;
  padding:14px 10px;font-size:19px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px dashed var(--blue);outline-offset:3px}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:10px}
h1{font-size:42px;margin:0;font-weight:400;line-height:1.05}
.sub{color:var(--green);font-size:22px;margin-top:2px}
.sk{border:2px solid var(--ink);border-radius:14px 5px 12px 6px/6px 12px 5px 14px;background:var(--paper)}
.sk.thin{border-width:1.5px}
.sk.dash{border-style:dashed}
.hatch-blue{background:repeating-linear-gradient(45deg,var(--blue-hatch) 0 1.3px,transparent 1.3px 7px),repeating-linear-gradient(-45deg,var(--blue-hatch) 0 1.3px,transparent 1.3px 7px),var(--blue-bg)}
.hatch-yellow{background:repeating-linear-gradient(45deg,var(--yellow-hatch) 0 1.3px,transparent 1.3px 7px),repeating-linear-gradient(-45deg,var(--yellow-hatch) 0 1.3px,transparent 1.3px 7px),var(--yellow-bg)}
.btn{font-size:19px;padding:5px 16px;background:var(--paper);border:2px solid var(--ink);border-radius:12px 4px 10px 5px/5px 10px 4px 12px;cursor:pointer;box-shadow:2px 3px 0 var(--ink);white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn:active{transform:translate(1px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.pri:hover{background:#343a40}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;transform:none}
.btn.small{font-size:16px;padding:2px 10px;box-shadow:1px 2px 0 var(--ink)}
.tools{display:flex;gap:10px;align-items:center}
.label{font-size:16px;color:var(--muted)}
.code{font-family:var(--hand);white-space:pre-wrap;word-break:break-word;line-height:1.5}
.c-blue{color:var(--blue)} .c-green{color:var(--green)} .c-orange{color:var(--orange)} .c-red{color:var(--red)} .c-pink{color:var(--pink)} .c-yellow{color:var(--yellow)} .c-violet{color:var(--violet)} .c-muted{color:var(--muted)}
mark.hl{background:linear-gradient(transparent 55%,#ffec99 55%);color:inherit;padding:0 2px}
@keyframes wob{0%,100%{transform:rotate(-.6deg)}50%{transform:rotate(.6deg)}}
@keyframes popin{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.pop{animation:popin .35s ease-out}
@media (prefers-reduced-motion: reduce){.pop{animation:none}}

/* Layout: URL bar + step controls on top; sequence diagram (left) and "what is happening now" panel (right) */
.bar{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.url{flex:1;display:flex;align-items:center;gap:8px;padding:4px 12px;min-width:0}
.url .lock{font-size:16px;padding:0 8px;border-radius:6px;white-space:nowrap}
.url .lock.s{color:var(--green);background:var(--green-bg)} .url .lock.p{color:var(--red);background:var(--red-bg)}
.url input{flex:1;min-width:0;border:0;background:transparent;font-size:22px;outline:none}
.seg{display:flex;gap:6px}
.seg .btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.main{display:grid;grid-template-columns:800px 1fr;gap:16px;height:568px}
.diagram{padding:4px;position:relative}
.diagram svg{width:100%;height:100%;display:block;font-family:var(--hand)}
.diagram text{paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.side{display:flex;flex-direction:column;gap:10px;min-height:0}
.now{padding:12px 16px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}
.now .count{display:flex;justify-content:space-between;align-items:center;font-size:16px;color:var(--muted)}
.dots{display:flex;gap:5px}
.dots i{width:12px;height:12px;border:1.5px solid var(--ink);border-radius:50% 45% 50% 40%}
.dots i.on{background:var(--ink)} .dots i.cur{background:var(--yellow-hatch);border-color:var(--yellow)}
.now h2{margin:0;font-size:30px;font-weight:400;line-height:1.15}
.now p{margin:0;font-size:18px}
.now .fin{color:var(--green);background:var(--green-bg)}
.ana{padding:6px 12px;font-size:17px;background:var(--yellow-bg)}
.ana b{font-weight:400;color:var(--yellow)}
.wire{padding:6px 12px;font-size:17px;background:var(--soft);min-height:40px}
.wire .label{display:block;font-size:14px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap}
.time{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--muted)}
.time .track{flex:1;height:14px;border:1.5px solid var(--ink);border-radius:8px 3px 7px 4px;display:flex;overflow:hidden}
.time .track span{height:100%}
.time b{font-weight:400;color:var(--ink);font-size:19px;min-width:72px;text-align:right}
.mini{height:150px;display:flex;flex-direction:column;overflow:hidden}
.mini .chrome{display:flex;gap:8px;align-items:center;padding:3px 10px;border-bottom:1.5px solid var(--ink);font-size:14px;color:var(--muted)}
.mini .chrome i{width:9px;height:9px;border:1.5px solid var(--ink);border-radius:50%}
.mini .page{flex:1;padding:8px 14px;font-size:16px;overflow:hidden}
.mini .page h3{margin:0 0 4px;font-size:22px;font-weight:400}
.mini .page .ln{height:8px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--line) 0 70%,transparent 70% 100%);margin:6px 0}
.spin{display:inline-block;animation:wob .5s infinite}
</style>
</head>
<body>


<div class="viewport" id="vp">
<div class="stage" id="stage">
  <div class="top">
    <div><h1>一次請求的旅程</h1><div class="sub">在網址列按下 Enter 之後，到畫面出現之前，發生了哪些事？</div></div>
    <button class="btn small" id="fs" type="button">全螢幕</button>
  </div>
  <div class="bar">
    <label class="url sk"><span class="lock s" id="lock">https 加密</span><input id="url" value="https://vanscoding.com/articles/working-memory" spellcheck="false" aria-label="網址"></label>
    <div class="seg" role="group" aria-label="協定">
      <button class="btn" type="button" id="p-https" aria-pressed="true">https</button>
      <button class="btn" type="button" id="p-http" aria-pressed="false">http</button>
    </div>
  </div>
  <div class="main">
    <div class="diagram sk"><svg id="svg" viewBox="0 0 800 560" aria-label="請求流程圖"></svg></div>
    <div class="side">
      <div class="now sk" id="now"></div>
      <div class="ctrl">
        <button class="btn" type="button" id="prev">上一步</button>
        <button class="btn pri" type="button" id="next">下一步</button>
        <button class="btn" type="button" id="auto">自動播放</button>
        <button class="btn" type="button" id="reset">重來</button>
      </div>
      <div class="time"><span>累計時間</span><div class="track" id="track"></div><b id="ms">0 ms</b></div>
      <div class="mini sk"><div class="chrome"><i></i><i></i><span id="mUrl"></span></div><div class="page" id="mPage"></div></div>
    </div>
  </div>
</div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
(() => {
  const st = $('stage'), vp = $('vp');
  const fit = () => { const s = Math.min(vp.clientWidth / 1280, vp.clientHeight / 720); st.style.setProperty('--s', s > 0 ? s : 1); };
  new ResizeObserver(fit).observe(vp); addEventListener('resize', fit); fit();
  const fs = $('fs');
  if (fs){
    fs.addEventListener('click', async () => {
      try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); }
      catch (e) { fs.textContent = '無法全螢幕'; setTimeout(() => fs.textContent = '全螢幕', 1600); }
    });
    document.addEventListener('fullscreenchange', () => { fs.textContent = document.fullscreenElement ? '結束全螢幕' : '全螢幕'; fit(); });
  }
})();

/* ---- tiny "rough" sketch helpers: stable jitter per seed ---- */
function Rnd(seed){ let s = Math.abs(Math.floor(seed)) % 2147483647 || 1; return () => (s = s * 16807 % 2147483647) / 2147483647; }
function skLine(x1, y1, x2, y2, seed, o = {}){
  const r = Rnd(seed * 97 + 13), len = Math.hypot(x2 - x1, y2 - y1), off = Math.min(2.4, len * 0.012 + 0.6);
  let d = '';
  for (let k = 0; k < 2; k++){
    const j = () => (r() - 0.5) * 1.6;
    const mx = (x1 + x2) / 2 + (r() - 0.5) * off * 2, my = (y1 + y2) / 2 + (r() - 0.5) * off * 2;
    d += `M${(x1 + j()).toFixed(1)} ${(y1 + j()).toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${(x2 + j()).toFixed(1)} ${(y2 + j()).toFixed(1)} `;
  }
  return `<path d="${d}" fill="none" stroke="${o.c || '#1e1e1e'}" stroke-width="${o.w || 1.8}" stroke-linecap="round"${o.dash ? ' stroke-dasharray="7 6"' : ''}/>`;
}
function skHead(x1, y1, x2, y2, seed, o){
  const a = Math.atan2(y2 - y1, x2 - x1), L = 12, s = 0.45;
  return skLine(x2, y2, x2 - L * Math.cos(a - s), y2 - L * Math.sin(a - s), seed + 1, { ...o, dash:false })
       + skLine(x2, y2, x2 - L * Math.cos(a + s), y2 - L * Math.sin(a + s), seed + 2, { ...o, dash:false });
}
function skArrow(x1, y1, x2, y2, seed, o = {}){
  return skLine(x1, y1, x2, y2, seed, o) + skHead(x1, y1, x2, y2, seed, o) + (o.both ? skHead(x2, y2, x1, y1, seed + 7, o) : '');
}
function skRect(x, y, w, h, seed, o = {}){
  const fill = o.fill ? `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${o.fill}"/>` : '';
  const hatch = o.hatch ? `<rect x="${x + 2}" y="${y + 2}" width="${w - 4}" height="${h - 4}" rx="5" fill="url(#${o.hatch})"/>` : '';
  return fill + hatch + skLine(x, y, x + w, y, seed, o) + skLine(x + w, y, x + w, y + h, seed + 3, o) + skLine(x + w, y + h, x, y + h, seed + 5, o) + skLine(x, y + h, x, y, seed + 9, o);
}
function hatchDefs(){
  const p = (id, c) => `<pattern id="${id}" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${c}" stroke-width="1.2"/><line x1="0" y1="0" x2="7" y2="0" stroke="${c}" stroke-width="1.2"/></pattern>`;
  return `<defs>${p('hb','rgba(25,113,194,.33)')}${p('hy','rgba(240,140,0,.4)')}${p('hg','rgba(47,158,68,.3)')}${p('ho','rgba(232,89,12,.3)')}${p('hk','rgba(30,30,30,.25)')}</defs>`;
}

(() => {
  const X = { b:110, d:400, w:690 };
  const COL = { orange:'#e8590c', green:'#2f9e44', pink:'#c2255c', blue:'#1971c2', ink:'#1e1e1e', grey:'#868e96' };
  let host = 'vanscoding.com', path = '/articles/working-memory', secure = true, idx = 0, timer = null;

  const STEPS = () => [
    { k:'arrow', from:'b', to:'d', y:88, c:COL.orange, top:`${host} 的 IP 是？`, bot:'DNS 查詢', ms:12, phase:'DNS',
      title:'先查地址：DNS 查詢', text:`瀏覽器只知道名字「${host}」，不知道這台伺服器在網路上的位址。所以先去問 DNS 伺服器。`,
      ana:'寄信之前，先查收件人的地址。', wire:`問：${host} 的 IP 位址是？` },
    { k:'arrow', from:'d', to:'b', y:146, c:COL.orange, dash:true, top:'93.184.216.34', bot:'回傳 IP 位址', ms:12, phase:'DNS',
      title:'DNS 回答', text:'DNS 回答一串數字，這就是伺服器的 IP 位址。瀏覽器會記住一陣子，下次就不用再問。',
      ana:'查到地址了：xx 路 93 號。', wire:`答：${host} → 93.184.216.34` },
    { k:'arrow', from:'b', to:'w', y:202, c:COL.ink, mid:'SYN', ms:15, phase:'TCP', group:'tcp',
      title:'建立連線：TCP 握手 ①', text:'有了地址，接著要跟伺服器「接通」。瀏覽器先說：我想跟你連線，聽得到嗎？',
      ana:'打電話：「喂？」', wire:'SYN' },
    { k:'arrow', from:'w', to:'b', y:227, c:COL.ink, dash:true, mid:'SYN-ACK', ms:15, phase:'TCP', group:'tcp',
      title:'TCP 握手 ②', text:'伺服器回：聽得到！那你聽得到我嗎？',
      ana:'「喂，聽得到，你呢？」', wire:'SYN-ACK' },
    { k:'arrow', from:'b', to:'w', y:252, c:COL.ink, mid:'ACK', ms:1, phase:'TCP', group:'tcp',
      title:'TCP 握手 ③', text:'瀏覽器：聽得到！三次確認之後，連線建立，雙方都知道對方在線上。',
      ana:'「好，那我們開始說正事。」', wire:'ACK' },
    { k:'arrow', from:'b', to:'w', y:315, c:COL.pink, both:true, mid:'交換憑證 + 協商加密金鑰', ms:30, phase:'TLS', group:'tls', httpsOnly:true,
      title:'上鎖：TLS 握手', text:`伺服器出示憑證，證明自己真的是 ${host}；雙方再一起產生只有彼此知道的金鑰。之後傳的內容，路上的人都看不懂。`,
      ana:'把明信片換成上鎖的信封。', wire:'憑證、加密方式、金鑰材料（之後全部加密）' },
    { k:'arrow', from:'b', to:'w', y:384, c:COL.green, big:'HTTP Request', bot:`GET ${path} HTTP/1.1`, ms:12, phase:'HTTP',
      title:'終於輪到 HTTP：送出請求', text:`前面都是準備。現在瀏覽器才真正說出要什麼：請給我 ${path} 這一頁。`,
      ana:'把寫好的點菜單交給服務生。', wire:`GET ${path} HTTP/1.1\nHost: ${host}\nAccept: text/html` },
    { k:'box', at:'w', y:402, h:44, lines:['處理請求','查資料庫'], hatch:'hk', ms:40, phase:'伺服器',
      title:'伺服器處理', text:'伺服器找到這篇文章，可能還要查資料庫，再把內容組成一份 HTML。',
      ana:'廚房照著點菜單做菜。', wire:'（伺服器內部的工作，不在網路上傳）' },
    { k:'arrow', from:'w', to:'b', y:478, c:COL.blue, big:'HTTP Response', bot:'200 OK + HTML', ms:18, phase:'HTTP',
      title:'伺服器回應', text:'伺服器回傳狀態碼 200（成功），後面接著整份 HTML。',
      ana:'上菜！', wire:'HTTP/1.1 200 OK\nContent-Type: text/html\n\n<html> … </html>' },
    { k:'box', at:'b', y:498, h:44, lines:['解析 HTML','渲染畫面'], hatch:'hb', ms:30, phase:'畫面',
      title:'瀏覽器把畫面畫出來', text:'瀏覽器讀懂 HTML、畫出畫面。如果頁面裡還有圖片、CSS，就會再發更多請求，但這條連線可以重複使用，不用再握手。',
      ana:'開動！', wire:'（在你的電腦裡進行）' }
  ].filter(s => secure || !s.httpsOnly);
  const PHASE_C = { DNS:COL.orange, TCP:'#495057', TLS:COL.pink, HTTP:COL.green, '伺服器':COL.grey, '畫面':COL.blue };

  function txt(x, y, s, o = {}){
    return `<text x="${x}" y="${y}" text-anchor="${o.a || 'middle'}" font-size="${o.size || 17}" fill="${o.c || COL.ink}"${o.op != null ? ` opacity="${o.op}"` : ''}>${esc(s)}</text>`;
  }
  function draw(){
    const steps = STEPS(), cur = idx - 1;
    let s = hatchDefs();
    /* lane heads */
    [['b','Browser','#1971c2','#e7f5ff'],['d','DNS Server','#e8590c','#fff4e6'],['w','Web Server','#2f9e44','#ebfbee']].forEach(([k, name, c, bg], i) => {
      s += skRect(X[k] - 80, 6, 160, 44, 40 + i * 11, { c, fill:bg, w:2 }) + txt(X[k], 35, name, { size:21, c });
      s += skLine(X[k], 52, X[k], 552, 70 + i, { c:'#adb5bd', w:1.3, dash:true });
    });
    /* groups */
    const stOf = i => i < cur ? 'done' : i === cur ? 'cur' : 'todo';
    const tcpIdx = steps.map((x, i) => x.group === 'tcp' ? i : -1).filter(i => i >= 0);
    const tcpOn = tcpIdx.some(i => i <= cur);
    s += `<g opacity="${tcpOn ? 1 : .15}">${skRect(18, 178, 764, 94, 81, { c:COL.green, dash:true, w:1.4, fill:'rgba(235,251,238,.6)' })}`
       + txt(30, 200, 'TCP 三次握手', { a:'start', size:19 }) + txt(30, 221, '建立連線', { a:'start', size:15, c:COL.green }) + '</g>';
    if (secure){
      const ti = steps.findIndex(x => x.group === 'tls');
      s += `<g opacity="${ti <= cur ? 1 : .15}">${skRect(18, 288, 764, 54, 91, { c:COL.pink, dash:true, w:1.4, fill:'rgba(255,240,246,.7)' })}`
         + txt(30, 310, 'TLS 握手', { a:'start', size:19, c:COL.pink }) + txt(30, 331, 'HTTPS 才有', { a:'start', size:15, c:COL.pink }) + '</g>';
    } else {
      s += `<g opacity=".55">${skRect(18, 288, 764, 54, 91, { c:COL.grey, dash:true, w:1.2 })}`
         + txt(30, 310, 'TLS 握手', { a:'start', size:19, c:COL.grey }) + txt(400, 321, 'http 沒有這一步：之後的內容沒加密，路上的人都看得到', { size:17, c:COL.red })
         + skLine(26, 306, 112, 306, 93, { c:COL.red, w:1.6 }) + '</g>';
    }
    /* steps */
    steps.forEach((st, i) => {
      const state = stOf(i), op = state === 'todo' ? .13 : 1, w = state === 'cur' ? 2.8 : 1.9;
      let g = '';
      if (st.k === 'arrow'){
        const x1 = X[st.from], x2 = X[st.to], dir = Math.sign(x2 - x1), y = st.y;
        g += skArrow(x1 + dir * 6, y, x2 - dir * 6, y, 200 + i * 7, { c:st.c, w, dash:st.dash, both:st.both });
        const mx = (x1 + x2) / 2;
        if (st.top) g += txt(mx, y - 9, st.top, { c:st.c, size:18 });
        if (st.bot) g += txt(mx, y + 22, st.bot, { size:15 });
        if (st.mid) g += txt(st.to === 'd' || st.from === 'd' ? mx : 545, y - 7, st.mid, { size:16, c:st.c === COL.ink ? COL.ink : st.c });
        if (st.big) g += txt(mx, y - 9, st.big, { size:23, c:st.c });
        if (state === 'cur' && !REDUCE){
          const a = st.both ? x2 : x2 - dir * 6;
          g += `<circle cx="${x1}" cy="${y}" r="7" fill="${st.c}"><animate attributeName="cx" from="${x1}" to="${a}" dur=".8s" fill="freeze"/></circle>`;
        }
      } else {
        const cx = X[st.at];
        g += skRect(cx - 72, st.y, 144, st.h, 300 + i, { w, hatch:st.hatch, fill:'#fff' });
        g += txt(cx, st.y + 20, st.lines[0], { size:17 }) + txt(cx, st.y + 39, st.lines[1], { size:17 });
      }
      s += `<g opacity="${op}">${g}</g>`;
    });
    $('svg').innerHTML = s;
  }

  function side(){
    const steps = STEPS(), N = steps.length, cur = idx - 1;
    const dots = steps.map((_, i) => `<i class="${i < cur ? 'on' : i === cur ? 'cur' : ''}"></i>`).join('');
    let h;
    if (idx === 0){
      h = `<h2>準備出發</h2><p>你在網址列輸入網址、按下 Enter。瀏覽器要先做好幾件事，才能把網頁拿回來。</p>
           <div class="ana sk thin"><b>猜猜看：</b>在真正送出 HTTP 請求之前，還要做幾件事？</div><p class="c-muted" style="font-size:17px">按「下一步」開始。也可以改網址、切換 http／https 再看一次。</p>`;
    } else {
      const st = steps[cur];
      h = `<h2 style="color:${st.c || (st.at === 'b' ? COL.blue : COL.ink)}">${esc(st.title)}</h2><p>${esc(st.text)}</p>
           ${idx === N ? `<div class="ana fin sk thin">發現了嗎？HTTP 只佔最後幾步，前面都在「查地址、接通、上鎖」。</div>` : `<div class="ana sk thin"><b>比喻：</b>${esc(st.ana)}</div>`}
           <div class="wire sk thin"><span class="label">網路上實際傳的</span><span class="code">${esc(st.wire)}</span></div>`;
    }
    $('now').innerHTML = `<div class="count"><span>${idx === 0 ? '還沒開始' : `第 ${idx} 步 / 共 ${N} 步`}</span><span class="dots">${dots}</span></div>${h}`;
    $('now').classList.remove('pop'); void $('now').offsetWidth; $('now').classList.add('pop');
    /* timing */
    let total = 0; const segs = [];
    steps.slice(0, idx).forEach(st => { total += st.ms; segs.push([st.phase, st.ms]); });
    const full = steps.reduce((a, b) => a + b.ms, 0);
    $('track').innerHTML = segs.map(([p, m]) => `<span title="${p}" style="width:${m / full * 100}%;background:${PHASE_C[p]}"></span>`).join('');
    $('ms').textContent = `${total} ms`;
    /* mini browser */
    const reqI = steps.findIndex(x => x.big === 'HTTP Request'), resI = steps.findIndex(x => x.big === 'HTTP Response');
    $('mUrl').textContent = (secure ? 'https://' : 'http://') + host + path;
    let page;
    if (idx === N) page = `<h3>${esc(path.split('/').filter(Boolean).pop() || host)}</h3><div class="ln"></div><div class="ln" style="width:85%"></div><div class="ln" style="width:92%"></div><div class="ln" style="width:60%"></div>`;
    else if (idx > resI) page = `<span class="code c-muted">&lt;html&gt;&lt;head&gt;&lt;title&gt;…&lt;/title&gt; …<br>（收到 HTML 了，正在畫畫面）</span>`;
    else if (idx > 0) page = `<span class="c-muted"><span class="spin">◌</span> 連線中…畫面還是空白</span>`;
    else page = `<span class="c-muted">（空白）</span>`;
    $('mPage').innerHTML = page;
    $('prev').disabled = idx === 0; $('next').disabled = idx === N;
  }
  function render(){ draw(); side(); }

  function setScheme(sec){
    secure = sec;
    const v = $('url').value.trim().replace(/^https?:\/\//i, '');
    $('url').value = (sec ? 'https://' : 'http://') + v;
    sync();
  }
  function sync(){
    let u;
    try { u = new URL(/^https?:\/\//i.test($('url').value.trim()) ? $('url').value.trim() : 'https://' + $('url').value.trim()); } catch { return; }
    host = u.hostname || 'vanscoding.com'; path = (u.pathname || '/') + (u.search || '');
    secure = u.protocol === 'https:';
    $('p-https').setAttribute('aria-pressed', secure); $('p-http').setAttribute('aria-pressed', !secure);
    $('lock').textContent = secure ? 'https 加密' : 'http 沒加密'; $('lock').className = 'lock ' + (secure ? 's' : 'p');
    idx = Math.min(idx, STEPS().length);
    render();
  }
  function stopAuto(){ if (timer){ clearInterval(timer); timer = null; $('auto').textContent = '自動播放'; } }
  $('next').addEventListener('click', () => { stopAuto(); if (idx < STEPS().length){ idx++; render(); } });
  $('prev').addEventListener('click', () => { stopAuto(); if (idx > 0){ idx--; render(); } });
  $('reset').addEventListener('click', () => { stopAuto(); idx = 0; render(); });
  $('auto').addEventListener('click', () => {
    if (timer){ stopAuto(); return; }
    if (idx >= STEPS().length) idx = 0;
    $('auto').textContent = '暫停';
    const tick = () => { if (idx >= STEPS().length){ stopAuto(); return; } idx++; render(); };
    tick(); timer = setInterval(tick, 2200);
  });
  $('p-https').addEventListener('click', () => setScheme(true));
  $('p-http').addEventListener('click', () => setScheme(false));
  $('url').addEventListener('input', sync);
  $('url').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); stopAuto(); idx = 0; render(); $('next').focus(); } });
  sync();
})();
</script>

</body>
</html>
